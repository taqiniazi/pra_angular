<div class="wrapper1">
  <app-sidebar
    [open]="isSidebarOpen"
    (closeSidebarEvent)="closeSidebar()"
  ></app-sidebar>

  <div
    id="overlay"
    [class.active]="isSidebarOpen"
    (click)="closeSidebar()"
  ></div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header Component with Navbar -->
    <app-header (toggleSidebarEvent)="toggleSidebar()"></app-header>

    <main>
      <div class="container-fluid px-4">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
